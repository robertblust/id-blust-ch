# What ZITADEL holds: planned on every pull request, applied on every push to main, in the shape of
# infra.yml. The zitadel provider signs in with the key in the secret zitadel-admin-key, which the
# root reads from Secret Manager as the run's Google identity, so the key reaches no file, no
# variable of this workflow and no state. The root applies after ../infra.yml's has made the
# instance; on a push that changes both, a failed run here is re-run once infra's has passed.
name: zitadel
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: zitadel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terraform:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: zitadel
    steps:
      - uses: actions/checkout@v7
      - run: |
          jq -r '"PROJECT=\(.project)\nPROJECT_NUMBER=\(.project_number)"' ../deployment.json >> "$GITHUB_ENV"
      - run: |
          echo "WIF_PROVIDER=projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ github.event_name == 'push' && 'deploy' || 'deploy-plan' }}@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - if: github.event_name == 'pull_request'
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo 'Terraform plan for `zitadel`'; echo; echo '```'; tail -c 60000 plan.txt; echo '```'; } > comment.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          test "${{ steps.plan.outputs.exit }}" = "0"
      - if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve
      - if: github.event_name == 'push'
        run: terraform output -json sign_in
